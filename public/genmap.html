<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>noita livemap — generated world</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: monospace; }
      #ui {
        position: fixed; top: 8px; left: 8px; z-index: 10; color: #cde; background: rgba(10,14,20,.85);
        padding: 8px 10px; border-radius: 6px; font-size: 13px; display: flex; gap: 8px; align-items: center;
      }
      #ui input { width: 110px; background: #0a0f16; color: #cde; border: 1px solid #345; border-radius: 4px; padding: 3px 6px; }
      #ui button { background: #1c2b3a; color: #cde; border: 1px solid #345; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
      #status { position: fixed; bottom: 8px; left: 8px; z-index: 10; color: #9bd; font-size: 12px; background: rgba(10,14,20,.7); padding: 4px 8px; border-radius: 4px; }
      #telemetry {
        position: fixed; top: 44px; left: 8px; z-index: 10; color: #cde; background: rgba(10,14,20,.85);
        padding: 6px 10px; border-radius: 6px; font-size: 12px; line-height: 1.6;
      }
      #telemetry button { background: #1c2b3a; color: #cde; border: 1px solid #345; border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 12px; }
      #telemetry label { cursor: pointer; }
      canvas { display: block; cursor: grab; }
      canvas.dragging { cursor: grabbing; }
    </style>
  </head>
  <body>
    <div id="ui">
      <label>seed <input id="seed" /></label>
      <button id="load">load</button>
      <button id="live">live: off</button>
      <button id="zones" title="chunk classification overlay">zones</button>
      <button id="capture" title="capture-composite layer: at the captured seed (78633191) show the game's own capture pixels where the generator's runtime-computed lanes are still partial (ISSUES A10). Default OFF (user call 2026-10-21) — the capture is a fixed world that is never the live run's.">capture: off</button>
      <button id="regen" title="delete this seed's generated cache and regenerate from scratch">regen</button>
      <span id="hint">drag = pan · wheel = zoom (z <span id="zlabel"></span>)</span>
    </div>
    <div id="status">enter a seed and hit load</div>
    <div id="telemetry">
      <div id="tl-info">live: waiting for telemetry…</div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
        <button id="center" title="pan the map to the live player position">Center on player</button>
        <label title="re-center on every telemetry update (drag disables it)"><input type="checkbox" id="follow"> follow</label>
      </div>
    </div>
    <div id="legend" style="position:fixed;top:118px;left:8px;z-index:10;color:#cde;background:rgba(10,14,20,.85);padding:6px 10px;border-radius:6px;font-size:12px;display:none;line-height:1.6">
      <b style="color:#7fd97f">▪</b> wang generated&nbsp;&nbsp;
      <b style="color:#e05b5b">▪</b> unsupported atlas&nbsp;&nbsp;
      <b style="color:#f0a030">▪</b> no attempt accepted<br/>
      <b style="color:#59b8ff">▪</b> non-wang (template/sky)&nbsp;&nbsp;
      <b style="color:#ff5bd8">▪</b> Holy Mountain band&nbsp;&nbsp;
      <b style="color:#ffffff66">▯</b> chunk grid
    </div>
    <canvas id="cv"></canvas>
    <script type="module">
      // State machines: the bridge link = /live-link.mjs (src/live-link.mjs);
      // tile entries, the status poll and the status line = /genmap-viewer.mjs
      // (src/genmap-viewer.mjs). Both are tested in tests/; this page renders.
      import { createLiveLink, describe as describeLink } from "./live-link.mjs";
      import { createTileCache, createStatusPoller, composeStatus, notice as makeNotice } from "./genmap-viewer.mjs";

      // canvas px = virtual-map px * 512; chunk (0,0) = biome px (0,-48) = world (-17920,-31744)
      // 71x144 chunks = clamped virtual map (48 sky rows + 70x48 band + 48 deep rows + 1 east col)
      const CHUNKS_W = 71, CHUNKS_H = 144;
      const TILE = 512, MAXZ = 6;
      const cv = document.getElementById("cv");
      const ctx = cv.getContext("2d");
      ctx.imageSmoothingEnabled = false;
      const status = document.getElementById("status");

      const params = new URLSearchParams(location.search);
      // static demo (GitHub Pages): the pyramid for one seed is pre-rendered
      // by mapgen/server/bake-static.mjs into static-tiles/ — no genmap
      // server, no bridge. Tiles outside the baked set are air (black).
      const STATIC_DEMO = params.get("static") === "1";
      const AIR_PNG = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR4AWMAgv8AAQQBAP8H9UQAAAAASUVORK5CYII=";
      let staticRev = null, staticSeed = null, staticBakedAt = null;
      // The Image element cannot tell a 404 (not baked = air) from a network
      // failure, and the tile cache would retry "air" forever — so the static
      // loader fetches first: 200 → blob URL, 404 → the 1×1 air tile. The
      // fetch logic rides a src setter ON the Image instance (the viewer
      // hands e.img straight to ctx.drawImage); the FINAL assignment goes
      // through the native setter, otherwise setting the blob URL would
      // re-enter this setter and fetch the blob URL forever.
      const NATIVE_IMG_SRC = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src").set;
      function makeStaticImage() {
        const img = new Image();
        Object.defineProperty(img, "src", {
          configurable: true,
          set(url) {
            fetch(url).then((r) => {
              if (r.ok) {
                return r.blob().then((b) => NATIVE_IMG_SRC.call(img, URL.createObjectURL(b)));
              }
              if (r.status === 404) { NATIVE_IMG_SRC.call(img, AIR_PNG); return; }
              throw new Error(`HTTP ${r.status}`);
            }).catch(() => { if (img.onerror) img.onerror(new Event("error")); });
          },
          get() { return img.getAttribute("src"); },
        });
        return img;
      }
      const seedInput = document.getElementById("seed");
      seedInput.value = params.get("seed") ?? "78633191";

      let seed = null, z = 1, cam = { x: 35 * 512, y: 62 * 512 }; // start at spawn (world 0,0)
      // dig: the smooth zoom — zF = the CONTINUOUS zoom (the wheel deltas
      // accumulate; z = the nearest integer tile LEVEL actually fetched).
      // The display scale interpolates between the levels (drawImage scales
      // the tiles) → the trackpad bursts become buttery instead of the
      // per-notch 2× jumps; the tile refetch only at the level crossings.
      let zF = 1, zFtarget = 1, zFanim = null;
      // dig: the zoom anchor — the world point + the screen position frozen
      // at the wheel event; the eased animation keeps THIS world point under
      // the cursor at every interpolated frame (the first cut re-anchored
      // with the mid-flight scale against the target scale = the hard
      // one-direction drift).
      let zAnchor = null;
      function setZoomTarget(t) {
        zFtarget = Math.max(0, Math.min(MAXZ, t));
        if (zFanim == null) zFanim = requestAnimationFrame(zoomStep);
      }
      function zoomStep() {
        zF += (zFtarget - zF) * 0.25;
        if (Math.abs(zFtarget - zF) < 0.002) zF = zFtarget;
        const zL = Math.round(zF);
        if (zL !== z) { z = zL; } // the fetch level flips at the .5 crossings
        if (zAnchor) {
          cam.x = zAnchor.wx - (zAnchor.mx - cv.width / 2) * 2 ** zF;
          cam.y = zAnchor.wy - (zAnchor.my - cv.height / 2) * 2 ** zF;
        }
        draw();
        if (zF !== zFtarget) zFanim = requestAnimationFrame(zoomStep);
        else { zFanim = null; zAnchor = null; }
      }
      const tiles = createTileCache({ makeImage: STATIC_DEMO ? makeStaticImage : () => new Image(), onSettle: () => draw() });
      let gen = null; // latest /gen/status for `seed`
      let unreachable = null; // { retryAt } while the status poll fails
      let notice = null; // transient status message { text, until }
      let tileCounts = { pending: 0, failed: 0 };
      function setNotice(text) { notice = makeNotice(text); renderStatus(); setTimeout(renderStatus, 4050); }
      function renderStatus() {
        status.textContent = composeStatus({ seed, z, gen, unreachable, tiles: tileCounts, notice, marker, now: Date.now() });
      }
      let zones = null, showZones = false; // per-chunk tags
      let epoch = 0; // server cache epoch (/gen/status) — busts the browser's immutable tile cache after a /gen/clear
      let captureOn = false; // capture-composite display layer (A10) — default OFF (user call 2026-10-21); the tile URL carries an explicit ?c=1/0 either way
      let marker = null, followMarker = false; // marker = last telemetry position (kept when live goes off)

      const liveBtn = document.getElementById("live");
      const tlInfo = document.getElementById("tl-info");
      const centerBtn = document.getElementById("center");
      const followChk = document.getElementById("follow");
      const W2C = { x: 17920, y: 31744 }; // world -> canvas: canvas = world + (17920, 31744)

      function setFollow(on) {
        followMarker = on;
        followChk.checked = on;
      }

      function centerOnPlayer() {
        if (!marker) return false;
        cam = { x: marker.wx + W2C.x, y: marker.wy + W2C.y };
        draw();
        return true;
      }

      const TONE_COLORS = { ok: "#7ce38b", warn: "#ffd479", error: "#ff8f8f", muted: "#8a9aaa" };
      function updateTelemetryBox() {
        if (STATIC_DEMO) return; // the boot wrote the static demo text; keep it
        const { text, tone } = describeLink(link.model);
        tlInfo.textContent = "";
        const head = document.createElement("div");
        head.textContent = text;
        head.style.color = TONE_COLORS[tone];
        tlInfo.appendChild(head);
        if (marker) {
          const mapNote = marker.seed === seed ? "" : ` (map: ${seed})`;
          const pos = document.createElement("div");
          pos.textContent = `seed ${marker.seed}${mapNote} · ${marker.biome ?? "?"} · ${Math.round(marker.wx)}, ${Math.round(marker.wy)}`;
          if (link.model.state !== "live") pos.style.opacity = "0.55"; // last known, not current
          tlInfo.appendChild(pos);
        }
      }

      // live mode = the bridge link running (off ⇄ connecting/waiting/live/stale/retrying)
      const link = createLiveLink({
        url: `ws://${location.hostname || "localhost"}:8080`,
        onChange: (m, prev) => {
          if (m.telemetry && m.telemetry !== prev.telemetry) onTelemetry(m.telemetry);
          if (m.state !== prev.state) renderLiveButton();
          updateTelemetryBox();
        },
      });
      const isLive = () => link.model.state !== "off";

      function renderLiveButton() {
        const on = isLive();
        liveBtn.textContent = `live: ${on ? "ON" : "off"}`;
        liveBtn.style.background = on ? "#2c5a2c" : "#1c2b3a";
      }

      function onTelemetry(t) {
        if (t.seed == null) return; // no numeric seed — nothing to place on a map
        marker = { wx: t.x, wy: t.y, seed: t.seed, biome: t.biome };
        if (marker.seed !== seed) {
          loadSeed(marker.seed);
          if (!followMarker) centerOnPlayer(); // jumped to the live run — start at the player
        }
        if (followMarker) cam = { x: marker.wx + W2C.x, y: marker.wy + W2C.y };
        draw();
      }

      function setLive(on) {
        if (on) {
          link.start();
          if (marker && marker.seed !== seed) {
            loadSeed(marker.seed);
            centerOnPlayer();
          }
        } else {
          link.stop();
        }
        renderLiveButton();
        updateTelemetryBox();
      }
      liveBtn.onclick = () => setLive(!isLive());

      function loadSeed(s) {
        const v = parseInt(String(s), 10);
        if (Number.isNaN(v)) return;
        if (STATIC_DEMO && staticSeed != null && (v >>> 0) !== staticSeed) {
          setNotice(`static demo: only seed ${staticSeed} is baked`);
          seedInput.value = String(staticSeed);
          return;
        }
        seed = v >>> 0;
        tiles.clear();
        gen = STATIC_DEMO ? { ready: true, done: 1, total: 1, errors: [] } : null;
        unreachable = null;
        zones = null;
        if (showZones) loadZones();
        seedInput.value = String(seed);
        history.replaceState(null, "", `?seed=${seed}${STATIC_DEMO ? "&static=1" : ""}`);
        if (!STATIC_DEMO) poller.follow(seed); // supersedes the previous seed's poll loop
        updateTelemetryBox();
        draw();
      }

      const ZONE_COLORS = { 1: "127,217,127", 2: "224,91,91", 3: "240,160,48", 0: "89,184,255", 5: "255,91,216" };

      function loadZones() {
        const asked = seed;
        fetch(`/gen/zones/${asked}`).then((r) => r.json()).then((s) => { if (asked === seed) { zones = s; draw(); } })
          .catch(() => { if (asked === seed) setNotice("zones overlay failed to load"); });
      }

      function resize() { cv.width = innerWidth; cv.height = innerHeight; ctx.imageSmoothingEnabled = false; draw(); }
      addEventListener("resize", resize);

      function tileUrl(tx, ty, tz) {
        if (STATIC_DEMO) return `static-tiles/${staticSeed}/${tz}/${tx}_${ty}.png?v=${staticRev ?? "0"}`;
        return `/gen/tile/${seed}/${tz}/${tx}/${ty}.png?e=${epoch}&c=${captureOn ? 1 : 0}`;
      }
      const fetchTile = (tx, ty, tz) => tiles.request(`${seed}/${tz}/${tx}/${ty}`, tileUrl(tx, ty, tz));

      function draw() {
        document.getElementById("zlabel").textContent = zF.toFixed(1);
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, cv.width, cv.height);
        if (seed == null) { renderStatus(); return; }
        const scale = 1 / 2 ** zF;
        const w0 = cam.x - cv.width / 2 / scale, h0 = cam.y - cv.height / 2 / scale;
        // one tile level over the viewport: fetch = request missing tiles
        // (the active level); otherwise draw only what is already loaded
        // (the placeholder levels — perf C: no black gaps while zooming)
        const drawLevel = (L, fetch) => {
          if (L < 0 || L > 7) return 0;
          const gw = Math.ceil(CHUNKS_W / 2 ** L), gh = Math.ceil(CHUNKS_H / 2 ** L);
          const span = TILE * 2 ** L;
          const t0x = Math.floor(w0 / span), t0y = Math.floor(h0 / span);
          const t1x = Math.floor((w0 + cv.width / scale) / span), t1y = Math.floor((h0 + cv.height / scale) / span);
          let pending = 0, failed = 0;
          for (let ty = Math.max(0, t0y); ty <= Math.min(gh - 1, t1y); ty++) {
            for (let tx = Math.max(0, t0x); tx <= Math.min(gw - 1, t1x); tx++) {
              const t = fetch ? fetchTile(tx, ty, L) : tiles.peek(`${seed}/${L}/${tx}/${ty}`);
              if (!t || t.state !== "ok") { if (t?.state === "error") failed++; else pending++; continue; }
              const sx = (tx * span - cam.x) * scale + cv.width / 2;
              const sy = (ty * span - cam.y) * scale + cv.height / 2;
              const s = span * scale;
              ctx.drawImage(t.img, Math.round(sx), Math.round(sy), Math.ceil(s), Math.ceil(s));
            }
          }
          return { pending, failed };
        };
        for (let L = z + 3; L > z; L--) drawLevel(L, false); // coarser placeholders
        drawLevel(z - 1, false); // finer tiles already loaded (zooming out)
        tileCounts = drawLevel(z, true) || { pending: 0, failed: 0 };
        if (showZones && zones) {
          const cw = 512 * scale, ch = 512 * scale;
          for (let ty = 0; ty < CHUNKS_H; ty++) {
            for (let tx = 0; tx < CHUNKS_W; tx++) {
              const tag = zones.tags[ty * CHUNKS_W + tx];
              const sx = (tx * 512 - cam.x) * scale + cv.width / 2;
              const sy = (ty * 512 - cam.y) * scale + cv.height / 2;
              if (sx > cv.width || sy > cv.height || sx + cw < 0 || sy + ch < 0) continue;
              if (tag !== 1) {
                ctx.fillStyle = `rgba(${ZONE_COLORS[tag] ?? "89,184,255"},0.30)`;
                ctx.fillRect(sx, sy, cw, ch);
              }
              if (showGrid) {
                ctx.strokeStyle = "rgba(255,255,255,0.25)";
                ctx.strokeRect(sx + 0.5, sy + 0.5, cw - 1, ch - 1);
              }
            }
          }
        }
        if (marker && marker.seed === seed) {
          const mx = (marker.wx + W2C.x - cam.x) * scale + cv.width / 2;
          const my = (marker.wy + W2C.y - cam.y) * scale + cv.height / 2;
          if (mx > -20 && my > -20 && mx < cv.width + 20 && my < cv.height + 20) {
            const r = Math.max(6, 10 * scale);
            ctx.strokeStyle = "#ff3030";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(mx, my, r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(mx - r * 1.6, my); ctx.lineTo(mx + r * 1.6, my);
            ctx.moveTo(mx, my - r * 1.6); ctx.lineTo(mx, my + r * 1.6);
            ctx.stroke();
          }
        }
        renderStatus();
      }

      // one status loop per page (genmap-viewer.mjs createStatusPoller)
      const poller = createStatusPoller({
        fetchStatus: (sd) => fetch(`/gen/status/${sd}`).then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }),
        onStatus: (sd, s) => {
          if (sd !== seed) return;
          unreachable = null;
          // a /gen/clear from elsewhere (CLI, another tab) or a server restart
          // bumped the epoch — drop everything local and re-fetch (I46)
          if (s.epoch != null && s.epoch !== epoch) {
            epoch = s.epoch;
            tiles.clear();
            zones = null;
            if (showZones) loadZones();
          }
          gen = s;
          draw();
        },
        onError: (sd, err, wait) => {
          if (sd !== seed) return;
          unreachable = { retryAt: Date.now() + wait };
          renderStatus();
        },
      });

      const zonesBtn = document.getElementById("zones");
      const regenBtn = document.getElementById("regen");
      const captureBtn = document.getElementById("capture");
      const legend = document.getElementById("legend");
      let showGrid = false;
      zonesBtn.onclick = () => {
        showZones = !showZones;
        showGrid = showZones;
        legend.style.display = showZones ? "block" : "none";
        if (showZones && !zones) loadZones();
        draw();
      };

      captureBtn.onclick = () => {
        captureOn = !captureOn;
        captureBtn.textContent = `capture: ${captureOn ? "on" : "off"}`;
        tiles.clear(); // the layer flag rides the tile URLs — refetch both ways
        draw();
      };

      regenBtn.onclick = async () => {
        if (seed == null || regenBtn.disabled) return;
        regenBtn.disabled = true;
        try {
          const r = await fetch(`/gen/clear/${seed}`, { method: "POST" }).then((x) => x.json());
          epoch = r.epoch ?? epoch + 1;
          tiles.clear();
          gen = null;
          zones = null;
          if (showZones) loadZones();
          setNotice(`cache cleared — regenerating seed ${seed} from scratch…`);
          poller.follow(seed);
          draw();
        } catch {
          setNotice("cache clear failed (is the genmap server running?)");
        } finally {
          regenBtn.disabled = false;
        }
      };

      centerBtn.onclick = () => {
        if (!centerOnPlayer()) setNotice(`no player position yet — ${describeLink(link.model).text}`);
      };
      followChk.onchange = () => {
        setFollow(followChk.checked);
        if (followMarker) centerOnPlayer();
      };

      function load() {
        const v = parseInt(seedInput.value, 10);
        if (Number.isNaN(v)) return;
        loadSeed(v);
        if (isLive()) setFollow(false); // manual load/UI wins over follow until re-enabled
      }
      document.getElementById("load").onclick = load;
      seedInput.addEventListener("keydown", (e) => e.key === "Enter" && load());

      let dragging = false, last = null;
      cv.addEventListener("mousedown", (e) => { dragging = true; setFollow(false); zAnchor = null; last = [e.clientX, e.clientY]; cv.classList.add("dragging"); });
      addEventListener("mouseup", () => { dragging = false; cv.classList.remove("dragging"); });
      addEventListener("mousemove", (e) => {
        if (!dragging) return;
        const scale = 1 / 2 ** zF;
        cam.x -= (e.clientX - last[0]) / scale;
        cam.y -= (e.clientY - last[1]) / scale;
        last = [e.clientX, e.clientY];
        draw();
      });
      cv.addEventListener("wheel", (e) => {
        e.preventDefault();
        // the wheel deltas: the line-mode multiply, the trackpad pixel-mode = tiny —
        // accumulate into the eased target (the pinch = ctrl+wheel too).
        // The ANCHOR = frozen in the CURRENT frame (the world point under
        // the cursor + the cursor position); the eased zoom keeps THE point
        // under the cursor at every frame (the drift fix).
        const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
        const mx = e.clientX - cv.getBoundingClientRect().left;
        const my = e.clientY - cv.getBoundingClientRect().top;
        zAnchor = {
          wx: cam.x + (mx - cv.width / 2) * 2 ** zF,
          wy: cam.y + (my - cv.height / 2) * 2 ** zF,
          mx, my,
        };
        setZoomTarget(zFtarget - (e.ctrlKey ? d * 2.4 : d) * 0.0022);
      }, { passive: false });

      resize();
      load(); // auto-load the seed from the URL
      if (STATIC_DEMO) {
        // the static demo: manifest picks the baked seed + revision, the
        // server-side features (live bridge, zones, regen) stay hidden
        fetch("static-tiles/manifest.json").then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        }).then((m) => {
          staticRev = m.rev;
          staticSeed = m.seed;
          staticBakedAt = m.bakedAt;
          for (const id of ["live", "zones", "capture", "regen", "center"]) {
            const el = document.getElementById(id);
            if (el) el.style.display = "none";
          }
          const followLabel = document.getElementById("follow")?.parentElement;
          if (followLabel) followLabel.style.display = "none";
          document.getElementById("tl-info").innerHTML =
            `<b style="color:#7fd97f">static demo</b> — pre-rendered by the generator<br>seed ${m.seed} · baked ${String(m.bakedAt).slice(0, 10)}`;
          document.getElementById("seed").disabled = true;
          setNotice(`static demo — pre-rendered seed ${m.seed}`);
          loadSeed(m.seed);
        }).catch(() => setNotice("static tiles manifest missing — is this the Pages deployment?"));
      } else {
        setLive(true); // try the telemetry bridge (genmap shows the live run when Noita is open)
      }
    </script>
  </body>
</html>
