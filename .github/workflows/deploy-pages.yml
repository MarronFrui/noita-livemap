name: Deploy to GitHub Pages

# Publishes the static map viewer demo. The bridge (live tracking) and the
# server-side map generation need Node at runtime and stay out of this build;
# the viewer degrades gracefully without a bridge ("Bridge unreachable").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/noitamap and vendor/noita-tools are submodules;
          # copy-noitamap.mjs reads vendor/noitamap/public at build time.
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CI=true makes vite.config.ts emit the /noita-livemap/ base path.
      - run: npm run build
        env:
          CI: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
